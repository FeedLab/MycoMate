name: Deploy to MonsterASP

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          if ("${{ secrets.WEBSITE_NAME }}" -eq "") { echo "WEBSITE_NAME: NOT SET" } else { echo "WEBSITE_NAME: set ($("${{ secrets.WEBSITE_NAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_COMPUTER_NAME }}" -eq "") { echo "SERVER_COMPUTER_NAME: NOT SET" } else { echo "SERVER_COMPUTER_NAME: set ($("${{ secrets.SERVER_COMPUTER_NAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_USERNAME }}" -eq "") { echo "SERVER_USERNAME: NOT SET" } else { echo "SERVER_USERNAME: set ($("${{ secrets.SERVER_USERNAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_PASSWORD }}" -eq "") { echo "SERVER_PASSWORD: NOT SET" } else { echo "SERVER_PASSWORD: set ($("${{ secrets.SERVER_PASSWORD }}".Length) chars)" }
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish MycoMate.Api/MycoMate.Api.csproj -c Release -o publish

      - name: Deploy via WebDeploy
        run: |
          & "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe" `
            -verb:sync `
            -source:contentPath="$(Resolve-Path publish)" `
            -dest:contentPath="${{ secrets.WEBSITE_NAME }}",computerName="https://${{ secrets.SERVER_COMPUTER_NAME }}:8172/msdeploy.axd?site=${{ secrets.WEBSITE_NAME }}",userName="${{ secrets.SERVER_USERNAME }}",password="${{ secrets.SERVER_PASSWORD }}",authType="Basic" `
            -allowUntrusted `
            -enableRule:AppOffline
        shell: pwsh
