name: Deploy to MonsterASP

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug secrets
        run: |
          if ("${{ secrets.WEBSITE_NAME }}" -eq "") { echo "WEBSITE_NAME: NOT SET" } else { echo "WEBSITE_NAME: set ($("${{ secrets.WEBSITE_NAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_COMPUTER_NAME }}" -eq "") { echo "SERVER_COMPUTER_NAME: NOT SET" } else { echo "SERVER_COMPUTER_NAME: set ($("${{ secrets.SERVER_COMPUTER_NAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_USERNAME }}" -eq "") { echo "SERVER_USERNAME: NOT SET" } else { echo "SERVER_USERNAME: set ($("${{ secrets.SERVER_USERNAME }}".Length) chars)" }
          if ("${{ secrets.SERVER_PASSWORD }}" -eq "") { echo "SERVER_PASSWORD: NOT SET" } else { echo "SERVER_PASSWORD: set ($("${{ secrets.SERVER_PASSWORD }}".Length) chars)" }
        shell: pwsh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish MycoMate.Api/MycoMate.Api.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '${{ github.workspace }}/publish'
